# Ishonch reytingi sahifasini HAR 10 DAQIQADA yangilaydi.
# GitHub'ning jadvali kechikadi (30–45 daq), shuning uchun bitta ishga tushish ~1 soat ishlaydi va
# ichida 6 marta: hisoblash → sahifani joylash → 9 daqiqa kutish. Keyingi ishga tushish navbatda
# turadi (concurrency) va darhol davom ettiradi. Instagram'ga yuklama o'zgarmaydi: soatiga 6 hisob.
# Sozlamalar: Secret IG_TOKEN · Variable IG_USER_ID · rejim rejim.txt faylida.
name: Ishonch reytingi

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  hisoblash:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url }}
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sinovlar
        run: python test_vote_counter.py
      - uses: actions/configure-pages@v5

      # --- 1/6 ---
      - name: Hisob 1
        id: count1
        continue-on-error: true
        run: python vote_counter.py $(cat rejim.txt)
      - if: steps.count1.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: sahifa-1
      - if: steps.count1.outcome == 'success'
        id: deploy1
        uses: actions/deploy-pages@v4
        with:
          artifact_name: sahifa-1
      - name: Kutish 1
        run: sleep 540

      # --- 2/6 ---
      - name: Hisob 2
        id: count2
        continue-on-error: true
        run: python vote_counter.py $(cat rejim.txt)
      - if: steps.count2.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: sahifa-2
      - if: steps.count2.outcome == 'success'
        id: deploy2
        uses: actions/deploy-pages@v4
        with:
          artifact_name: sahifa-2
      - name: Kutish 2
        run: sleep 540

      # --- 3/6 ---
      - name: Hisob 3
        id: count3
        continue-on-error: true
        run: python vote_counter.py $(cat rejim.txt)
      - if: steps.count3.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: sahifa-3
      - if: steps.count3.outcome == 'success'
        id: deploy3
        uses: actions/deploy-pages@v4
        with:
          artifact_name: sahifa-3
      - name: Kutish 3
        run: sleep 540

      # --- 4/6 ---
      - name: Hisob 4
        id: count4
        continue-on-error: true
        run: python vote_counter.py $(cat rejim.txt)
      - if: steps.count4.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: sahifa-4
      - if: steps.count4.outcome == 'success'
        id: deploy4
        uses: actions/deploy-pages@v4
        with:
          artifact_name: sahifa-4
      - name: Kutish 4
        run: sleep 540

      # --- 5/6 ---
      - name: Hisob 5
        id: count5
        continue-on-error: true
        run: python vote_counter.py $(cat rejim.txt)
      - if: steps.count5.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: sahifa-5
      - if: steps.count5.outcome == 'success'
        id: deploy5
        uses: actions/deploy-pages@v4
        with:
          artifact_name: sahifa-5
      - name: Kutish 5
        run: sleep 540

      # --- 6/6 ---
      - name: Hisob 6
        id: count6
        continue-on-error: true
        run: python vote_counter.py $(cat rejim.txt)
      - if: steps.count6.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: sahifa-6
      - if: steps.count6.outcome == 'success'
        id: deploy6
        uses: actions/deploy-pages@v4
        with:
          artifact_name: sahifa-6
