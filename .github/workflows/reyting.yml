# Har 10 daqiqada Instagram izohlarini sanab, Ishonch reytingi sahifasini GitHub Pages'da yangilaydi.
# Sozlamalar (Settings → Secrets and variables → Actions):
#   Secret   IG_TOKEN    — Ins24.uz sahifasining tokeni
#   Variable IG_USER_ID  — 17841415393218526
#   Variable VOTE_ARGS   — challenge oldidan "--empty" (hammasi 0), boshlangach "--latest-reel --days 30"
name: Ishonch reytingi

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  hisoblash:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ovozlarni sanash
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python vote_counter.py ${{ vars.VOTE_ARGS || '--empty' }}
      - name: Sinovlar
        run: python test_vote_counter.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
